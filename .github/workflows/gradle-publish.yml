name: Package Minecraft Mod

on:
  release:
    types: [created, published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    # Package the contents of the 'mod' folder into a .jar file
    - name: Package Mod Folder as JAR
      run: zip -r MyMinecraftMod.jar mod/*

    # Upload the .jar file to your release assets
    - name: Upload Jar to Release
      uses: softprops/action-gh-release@v1
      with:
        files: MyMinecraftMod.jar
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
