# This workflow packages the mod folder into a .jar file and attaches it to GitHub Releases when created.

name: Gradle Package

on:
  release:
    types: [created]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        server-id: github
        settings-path: ${{ github.workspace }}

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build with Gradle
      run: ./gradlew build

    # Package the contents of the 'mod' folder into a .jar file
    - name: Package Mod Folder as JAR
      run: zip -r MyMinecraftMod.jar mod/*

    # Upload the .jar file as a downloadable build artifact in GitHub Actions
    - name: Upload Mod Jar Artifact
      uses: actions/upload-artifact@v4
      with:
        name: mod-jar-file
        path: MyMinecraftMod.jar

    # Attach the .jar file directly to your published GitHub Release
    - name: Upload Jar to Release
      uses: softprops/action-gh-release@v1
      with:
        files: MyMinecraftMod.jar
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Publish to GitHub Packages
      run: ./gradlew publish
      env:
        USERNAME: ${{ github.actor }}
        TOKEN: ${{ secrets.GITHUB_TOKEN }}
