name: Package Minecraft Mod

on:
  release:
    types: [created, published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    # Navigate into the mod folder and package its contents into a .jar file
    - name: Package Mod Folder as JAR
      run: |
        cd mod
        zip -r ../MyMinecraftMod.jar .

    # Attach the .jar file directly to your GitHub Release assets
    - name: Upload Jar to Release
      uses: softprops/action-gh-release@v1
      with:
        files: MyMinecraftMod.jar
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
